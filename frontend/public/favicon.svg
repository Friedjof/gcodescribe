<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1050 1050" role="img" aria-labelledby="title desc">
<title id="title">GCodeScribe</title>
<desc id="desc">An expressive G drawn by a stylus, with blue vector editing guides on a dark rounded tile.</desc>
<defs>
 <linearGradient id="bg" x1="0.05" y1="0" x2="0.9" y2="1"><stop stop-color="#1e2d45"/><stop offset=".5" stop-color="#111b2c"/><stop offset="1" stop-color="#0b1422"/></linearGradient>
 <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eef2fa"/></linearGradient>
 <linearGradient id="pen" x1="0" y1="0" x2="1" y2=".12"><stop stop-color="#dce8fc"/><stop offset=".28" stop-color="#9babc9"/><stop offset=".7" stop-color="#465471"/><stop offset="1" stop-color="#182337"/></linearGradient>
 <linearGradient id="tip" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".65" stop-color="#c4d3ed"/><stop offset="1" stop-color="#7288ac"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2de1ff"/><stop offset=".48" stop-color="#129bff"/><stop offset="1" stop-color="#0a71df"/></linearGradient>
 <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="10"/></filter>
 <clipPath id="tile"><rect x="7" y="7" width="1037" height="1028" rx="168"/></clipPath>
</defs>
<!-- Main tile -->
<rect x="7" y="7" width="1037" height="1028" rx="168" fill="url(#bg)" stroke="#64769a" stroke-width="8"/>
<g clip-path="url(#tile)">
